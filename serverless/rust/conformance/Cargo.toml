[package]
name = "turso_serverless_conformance"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Conformance tests for the Turso serverless driver and the SQL over HTTP protocol"
publish = false

[lib]
path = "lib.rs"

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "charset", "http2", "system-proxy", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
serde_json = { workspace = true }

[dev-dependencies]
base64 = "0.22"
tokio = { workspace = true, features = ["full"] }
turso_serverless = { path = ".." }
